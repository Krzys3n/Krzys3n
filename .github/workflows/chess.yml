name: Community Chess

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      reset_game:
        description: "Reset current chess game to starting position"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  chess-move:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'chess:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process chess move
        id: game
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'render' || 'move' }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMIT_SHA: ${{ github.sha }}
          RESET_GAME: ${{ inputs.reset_game || 'false' }}
        run: python3 .github/scripts/chess_game.py

      - name: Comment and close issue
        if: github.event_name == 'issues'
        env:
          MESSAGE: ${{ steps.game.outputs.message }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.MESSAGE || "Move processed.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Commit updated board
        if: steps.game.outputs.status == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md chess_games/state.json chess_images/
          git diff --staged --quiet || (git commit -m "chess: update board" && git push)
