name: Community Chess

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      reset_mode:
        description: "Reset game and optionally award a point"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "reset_only"
          - "owner_win"
          - "guests_win"
          - "draw"

permissions:
  contents: write
  issues: write

jobs:
  chess-move:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'chess:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process chess move
        id: game
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'render' || 'move' }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMIT_SHA: ${{ github.sha }}
          RESET_MODE: ${{ inputs.reset_mode || 'none' }}
        run: python3 .github/scripts/chess_game.py

      - name: Comment and close issue
        if: github.event_name == 'issues'
        env:
          MESSAGE: ${{ steps.game.outputs.message }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.MESSAGE || "Move processed.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Commit updated board
        id: commit
        if: steps.game.outputs.status == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md chess_games/state.json chess_images/
          if [ -d "chess_games/history" ] && [ "$(ls -A chess_games/history)" ]; then
            git add -A -- chess_games/history/
          fi
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chess: update board"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord webhook
        if: steps.game.outputs.status == 'ok' && steps.commit.outputs.changed == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHESS_MESSAGE: ${{ steps.game.outputs.message }}
          ACTOR: ${{ github.actor }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RESET_MODE: ${{ inputs.reset_mode || 'none' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -c '
          import json, os, urllib.request

          url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          msg = os.environ.get("CHESS_MESSAGE", "").strip()
          actor = os.environ.get("ACTOR", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          event_name = os.environ.get("EVENT_NAME", "")
          reset_mode = os.environ.get("RESET_MODE", "none")

          if not url or not msg:
              raise SystemExit(0)

          lines = [f"♟️ **{msg}**"]
          if event_name == "issues" and title:
              lines.append(f"Akcja: `{title}` od **@{actor}**")
          elif event_name == "workflow_dispatch":
              lines.append(f"Ręczne odświeżenie/reset (`{reset_mode}`) przez **@{actor}**")

          payload = json.dumps({"content": "\n".join(lines)}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "CommunityChessNotifier/1.0",
              },
              method="POST",
          )
          urllib.request.urlopen(req, timeout=15)
          '
